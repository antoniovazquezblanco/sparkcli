name: Build

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_library:
    strategy:
      fail-fast: false
      matrix:
        sys:
          - { name: "Ubuntu x64", runner: ubuntu-latest, os: Ubuntu, shell: bash, werror: true }
          - { name: "Ubuntu x64 Clang", runner: ubuntu-latest, os: Ubuntu, shell: bash, werror: true, cc: clang, cxx: clang++ }
          - { name: "Ubuntu ARM", runner: ubuntu-24.04-arm, os: Ubuntu, shell: bash, werror: true }
          - { name: "Windows x64 MSYS2", runner: windows-latest, os: Windows, shell: "msys2 {0}", werror: true }
          - { name: "Windows x64 VS", runner: windows-latest, os: Windows, shell: cmd, werror: false }
          - { name: "MacOS ARM", runner: macos-latest, os: MacOS, shell: bash, werror: true }
          - { name: "MacOS x64", runner: macos-15-intel, os: MacOS, shell: bash, werror: true }

    name: Build on ${{ matrix.sys.name }}
    runs-on: ${{ matrix.sys.runner }}
    defaults:
      run:
        shell: ${{ matrix.sys.shell }}

    steps:
      - name: Install dependencies (Ubuntu)
        if: matrix.sys.os == 'Ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install meson libcmocka-dev ${{ matrix.sys.cc }}

      - name: Install dependencies (Mac OS)
        if: matrix.sys.os == 'MacOS'
        run: brew install meson cmocka

      - name: Install dependencies (Windows MSYS2)
        if: matrix.sys.os == 'Windows' && startsWith(matrix.sys.shell, 'msys2')
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: git mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmocka

      - name: Install dependencies (Windows CMD)
        if: matrix.sys.os == 'Windows' && startsWith(matrix.sys.shell, 'cmd')
        run: python -m pip install meson

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select the compiler
        if: matrix.sys.cc
        run: |
          echo "CC=${{ matrix.sys.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.sys.cxx }}" >> "$GITHUB_ENV"

      - name: Configure
        run: meson setup build -Dtests=enabled -Dwerror=${{ matrix.sys.werror }}

      - name: Build
        run: meson compile -v -C build

      - name: Unit tests
        run: meson test -C build --suite unit --print-errorlogs

      - name: Example tests
        run: meson test -C build --no-suite unit --print-errorlogs

  strict_c_std:
    name: Build with c_std=${{ matrix.c_std }} (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        c_std: [c99, c11, c17, c23]
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install meson libcmocka-dev ${{ matrix.cc }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure
        run: meson setup build --werror -Dtests=enabled -Dc_std=${{ matrix.c_std }}

      - name: Build
        run: meson compile -v -C build

      - name: Test
        run: meson test -C build --suite unit --print-errorlogs

  configurations:
    name: Build ${{ matrix.config }} (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: static, cc: gcc, cxx: g++, options: -Dtests=enabled -Ddefault_library=static }
          - { config: release, cc: gcc, cxx: g++, options: -Dtests=enabled -Dbuildtype=release -Db_ndebug=true }
          - { config: sanitize, cc: gcc, cxx: g++, options: "-Dtests=enabled -Db_sanitize=address,undefined" }
          # Clang links the sanitizer runtime into executables only, so the
          # shared library has to be allowed undefined symbols.
          - { config: sanitize, cc: clang, cxx: clang++, options: "-Dtests=enabled -Db_sanitize=address,undefined -Db_lundef=false" }
          - { config: minimal, cc: gcc, cxx: g++, options: -Dtests=disabled -Dexamples=disabled }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # UBSan reports and carries on by default, which would pass the test.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install meson libcmocka-dev ${{ matrix.cc }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure
        run: meson setup build --werror ${{ matrix.options }}

      - name: Build
        run: meson compile -v -C build

      - name: Test
        run: meson test -C build --print-errorlogs
