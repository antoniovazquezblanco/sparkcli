name: Build

permissions:
  contents: read

on: [push, pull_request, workflow_dispatch]

jobs:
  build_library:
    strategy:
      matrix:
        sys:
          - { name: "Ubuntu x64", runner: ubuntu-latest, os: Ubuntu, shell: bash }
          - { name: "Ubuntu ARM", runner: ubuntu-24.04-arm, os: Ubuntu, shell: bash }
          - { name: "Windows x64 MSYS2", runner: windows-latest, os: Windows, shell: "msys2 {0}" }
          - { name: "Windows x64 VS", runner: windows-latest, os: Windows, shell: cmd }
          - { name: "MacOS ARM", runner: macos-latest, os: MacOS, shell: bash }
          - { name: "MacOS x64", runner: macos-15-intel, os: MacOS, shell: bash }

    name: Build on ${{ matrix.sys.name }}
    runs-on: ${{ matrix.sys.runner }}
    defaults:
      run:
        shell: ${{ matrix.sys.shell }}

    steps:
      - name: Install dependencies (Ubuntu)
        if: matrix.sys.os == 'Ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install meson libcmocka-dev

      - name: Install dependencies (Mac OS)
        if: matrix.sys.os == 'MacOS'
        run: brew install meson cmocka

      - name: Install dependencies (Windows MSYS2)
        if: matrix.sys.os == 'Windows' && startsWith(matrix.sys.shell, 'msys2')
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: git mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmocka

      - name: Install dependencies (Windows CMD)
        if: matrix.sys.os == 'Windows' && startsWith(matrix.sys.shell, 'cmd')
        run: python -m pip install meson

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure
        run: meson setup build -Dtests=enabled

      - name: Build
        run: meson compile -v -C build

      - name: Unit tests
        run: meson test -v -C build --suite unit

      - name: Test
        run: meson test -v -C build

  strict_c_std:
    name: Build with c_std=${{ matrix.c_std }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        c_std: [c99, c11, c17, c23]

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install meson libcmocka-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure
        run: meson setup build -Dtests=enabled -Dc_std=${{ matrix.c_std }}

      - name: Build
        run: meson compile -v -C build

      - name: Test
        run: meson test -v -C build --suite unit

  source_dist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install meson libcmocka-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure
        run: meson setup build -Dtests=enabled

      # meson dist archives HEAD, runs the version dist script, then
      # configures, builds, tests and installs the extracted tarball. That is
      # the whole release path, including the version resolving with no git.
      - name: Build and test the source tarball
        run: meson dist -C build --formats xztar,gztar

      # The other way people get the source: GitHub's "Source code" download
      # is a git archive, where export-subst fills in .archive-version.
      - name: Build a git archive export
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/archive"
          test ! -e "$RUNNER_TEMP/archive/.git"
          echo "archive version: $("$RUNNER_TEMP/archive/meson_version.py")"
          meson setup "$RUNNER_TEMP/archive-build" "$RUNNER_TEMP/archive" -Dtests=enabled
          meson compile -C "$RUNNER_TEMP/archive-build"
          meson test -C "$RUNNER_TEMP/archive-build" --suite unit

      - name: Upload the source tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-dist
          path: build/meson-dist/*
          if-no-files-found: error
